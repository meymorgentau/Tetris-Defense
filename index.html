
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Defense</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #171b2b;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #80cfff;
            margin-bottom: 10px;
        }

        .score {
            color: #80cfff;
            font-size: 18px;
            margin: 10px;
        }

        .game-container {
            padding: 15px;
            background: #252c42;
            border-radius: 12px;
            box-shadow: 0 0 20px #00000066;
        }

        canvas {
            display: block;
            background: #101625;
            border: 2px solid #80cfff;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #80cfff;
            color: #171b2b;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

            button:hover {
                background: #ffffff;
            }

        .instructions {
            margin-top: 12px;
            text-align: center;
            line-height: 1.7;
            color: #d4dbea;
        }
    </style>
</head>

<body>

    <h1>Tetris Defense</h1>

    <div class="score">
        Счёт: <span id="score">0</span>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="300" height="600"></canvas>
    </div>

    <div class="controls">
        <button id="pauseButton">Пауза</button>
        <button id="restartButton">Начать заново</button>
    </div>

    <div class="instructions">
        <p>A / D — движение пушки</p>
        <p>Пробел или клик мышью — выстрел</p>
        <p>P — пауза, R — перезапуск после проигрыша</p>
    </div>

    <script src="game.js"></script>

</body>
</html>
